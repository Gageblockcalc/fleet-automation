# Example for repos that deploy from CI: version bump + deploy + IndexNow ping.
name: deploy
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        uses: Gageblockcalc/fleet-automation/actions/version-bump@main
        with: { file: public/version.txt, replace-in: 'public/index.html' }
      # - run: npx wrangler@3 pages deploy public --project-name YOURPROJECT --branch main
      #   env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
      - uses: Gageblockcalc/fleet-automation/actions/indexnow@main
        with: { site: https://YOURSITE, key: YOUR_INDEXNOW_KEY }
